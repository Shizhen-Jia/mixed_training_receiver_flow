   <g id="text_1">
    <text style="fill: #17324d; font: 700 19px 'DejaVu Sans'; text-anchor: middle" x="411.6312" y="45.757624" transform="rotate(-0 411.6312 45.757624)">M02: Candidate evaluation and update loop</text>
   </g>
   <g id="text_2">
    <text style="fill: #52718a; font: 10.5px 'DejaVu Sans'; text-anchor: middle" x="411.6312" y="69.778937" transform="rotate(-0 411.6312 69.778937)">Proposed hardware organization | Repeat separately for each retained seed</text>
   </g>
   <g id="text_3">
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(362.655592 121.201515)">Coarse candidate seed from M01</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(380.459928 135.38973)">Initialize update_count = 0</text>
   </g>
   <g id="text_4">
    <text style="fill: #17324d; font: 11.2px 'DejaVu Sans'" transform="translate(372.970803 200.74438)">Current candidate parameters</text>
    <text style="fill: #17324d; font: 11.2px 'DejaVu Sans'" transform="translate(309.320678 214.628617)">delta: delay (samples)   |   f: Doppler (cycles/sample)</text>
   </g>
   <g id="text_5">
    <text style="fill: #17324d; font: 12px 'DejaVu Sans'; text-anchor: middle" x="457.840553" y="287.532484" transform="rotate(-0 457.840553 287.532484)">Replay original branch-2 samples R2[m]</text>
   </g>
   <g id="text_6">
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(371.702858 367.716842)">Phase accumulator + CORDIC</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(335.680007 381.905057)">Compensate Doppler: exp(-j * 2*pi * f * m)</text>
   </g>
   <g id="text_7">
    <text style="fill: #17324d; font: 11.4px 'DejaVu Sans'" transform="translate(323.313428 463.114319)">Integer-delay addressing + fractional-delay FIR</text>
    <text style="fill: #17324d; font: 11.4px 'DejaVu Sans'" transform="translate(327.963382 477.179158)">Compensate delay by evaluating at n + delta</text>
   </g>
   <g id="text_8">
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(331.349538 558.443608)">Compute correlation score against branch 1</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(360.166022 572.631823)">Use the declared valid sample set</text>
   </g>
   <g id="text_9">
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(363.330319 649.361866)">Compute gradient and curvature</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(364.998717 663.550081)">Use derivative accumulations or</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(363.846022 677.738296)">additional candidate evaluations</text>
   </g>
   <g id="text_10">
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(329.742233 751.659435)">Update delta and f within the search bounds</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(387.343757 765.84765)">Increment update_count</text>
   </g>
   <g id="text_11">
    <text style="fill: #17324d; font: 10.5px 'DejaVu Sans'" transform="translate(67.50475 558.585091)">Replayed branch-1</text>
    <text style="fill: #17324d; font: 10.5px 'DejaVu Sans'" transform="translate(79.075258 571.938466)">samples R1[n]</text>
   </g>
   <g id="text_12">
    <text style="fill: #17324d; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="457.840553" y="864.843872" transform="rotate(-0 457.840553 864.843872)">update_count &lt; 10?</text>
   </g>
   <g id="text_13">
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(374.626374 976.9829)">Matched final FIR refinement</text>
    <text style="fill: #17324d; font: 11.5px 'DejaVu Sans'" transform="translate(326.803444 991.171114)">Return refined delay, Doppler, and final score</text>
   </g>
   <g id="text_14">
    <text style="fill: #52718a; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="476.867934" y="927.510184" transform="rotate(-0 476.867934 927.510184)">No</text>
   </g>
   <g id="text_15">
    <text style="fill: #52718a; font: 10.5px 'DejaVu Sans'" transform="translate(773.874222 613.782771) rotate(-90)">Yes: next candidate evaluation</text>
   </g>
   <g id="text_16">
    <text style="fill: #52718a; font: 10px 'DejaVu Sans'; text-anchor: middle" x="411.6312" y="1065.781569" transform="rotate(-0 411.6312 1065.781569)">Ten gradient updates per seed; one update may require multiple sample passes.</text>
   </g>
   <g id="text_17">
    <text style="fill: #52718a; font: 10px 'DejaVu Sans'; text-anchor: middle" x="411.6312" y="1092.801194" transform="rotate(-0 411.6312 1092.801194)">M02 estimates alignment parameters. M05 computes cancellation weights.</text>
   </g>
  </g>
 </g>
